<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar proceso</title>
    <link rel="stylesheet" href="style2.css">
    <style>
        body { background:#f4f7f8; color:#263238; }
        .site-header { box-shadow:0 2px 12px rgba(38,50,56,.08); }
        .container { width:100%; box-sizing:border-box; margin:0 auto; padding:0 16px; }
        .brand-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; }
        .brand { display:flex; align-items:center; gap:9px; min-width:0; }
        .logo { width:72px; height:auto; }
        .site-title { font-size:18px; white-space:nowrap; }
        .back-btn { flex-shrink:0; padding:9px 11px; font-size:12px; }
        .demo-banner { background:#fff8df; border:1px solid #e8c95a; border-left:5px solid #e0aa00; color:#604600; padding:13px 14px; margin-bottom:18px; font-size:13px; line-height:1.45; font-weight:bold; border-radius:5px; }
        .process-card { max-width:520px; margin:0 auto; border:1px solid #e1e7e9; border-top:4px solid #8e44ad; padding:24px 18px; background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(38,50,56,.08); }
        .process-card h2 { margin:0 0 8px; color:#333; font-size:23px; line-height:1.2; }
        .process-card > p { color:#66747a; margin:0; line-height:1.6; }
        .process-card label { display:block; margin:24px 0 8px; font-weight:bold; color:#37474f; font-size:14px; }
        .process-card input { width:100%; box-sizing:border-box; min-height:50px; padding:13px 14px; border:1px solid #b8c4c8; border-radius:5px; font-size:16px; color:#263238; transition:border-color .2s, box-shadow .2s; }
        .process-card input:focus { outline:none; border-color:#8e44ad; box-shadow:0 0 0 3px rgba(142,68,173,.14); }
        .process-card .next-button { display:block; box-sizing:border-box; min-height:50px; text-align:center; margin-top:18px; background:#8e44ad; transition:background .2s, transform .2s; }
        .process-card .next-button:hover { background:#71368c; transform:translateY(-1px); }
        .error-message { color:#b3261e; min-height:20px; margin:8px 0 0; font-size:14px; }
        @media (min-width:601px) { .container { max-width:1100px; } .process-card { padding:32px; } .process-card h2 { font-size:26px; } .logo { width:110px; } .site-title { font-size:22px; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="brand-actions">
                <div class="brand">
                    <img class="logo" src="images/licencias22.png" alt="Logo de la demo LicenciasBA">
                    <div>
                        <h1 class="site-title">LICENCIAS<span style="font-weight:800;color:#0a6f6f">BA</span></h1>
                        <p style="margin:2px 0 0;color:#666;font-size:13px">Proceso Mi Argentina</p>
                    </div>
                </div>
                <a href="index.html" class="back-btn">VOLVER</a>
            </div>
        </div>
    </header>

    <main class="page2-container">
        <div class="demo-banner">.
        <section class="process-card">
            <h2>Finalizar proceso en trámite</h2>
            <p>Ingresá tu documento dni para continuar.</p>
            <form id="demo-form">
                <label for="numero">Documento DNI
                <input id="numero" name="numero" placeholder="ingrese su dni" autocomplete="off" required>
                <p id="error-message" class="error-message" role="alert"></p>
                <button type="submit" class="next-button">CONTINUAR</button>
            </form>
        </section>
    </main>

    <footer class="page2-footer">LICENCIAS BA</footer>
    <script>
        document.getElementById('demo-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const number = document.getElementById('numero').value.trim();
            const error = document.getElementById('error-message');
            const demoPages = {
                '42904977': 'usuario_42904977.html',
                '44217116': 'usuario_44217116.html',
                '38302348': 'usuario_44217116.html',
                '49410314': 'usuario_44217116.html',
                '25340117': 'usuario_44217116.html',
                'DEMO-42904977': 'usuario_42904977.html',
                'DEMO-44217116': 'usuario_44217116.html',
                'DEMO-38302348': 'usuario_44217116.html'
            };
            if (!demoPages[number]) {
                error.textContent = 'El número ingresado no es válido.';
                return;
            }
            window.location.href = demoPages[number];
        });
    </script>
</body>
</html>
